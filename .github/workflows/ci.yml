name: Verify source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Isolated SQLite installation, login and backup checks
        run: node --import tsx --test tests/installation.test.ts
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chronicle-cartarium:test .
      - name: Fresh container installation status
        shell: bash
        run: |
          docker run -d --name cc-smoke -p 127.0.0.1:3312:3001 -e HOST=0.0.0.0 -e SETUP_TOKEN=ci-isolated-bootstrap-test-only chronicle-cartarium:test
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3312/api/status > /tmp/cc-status.json; then break; fi
            sleep 1
          done
          node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/cc-status.json'));if(!s.setupRequired)process.exit(1)"
      - if: always()
        run: docker logs cc-smoke
      - if: always()
        run: docker rm -f cc-smoke
