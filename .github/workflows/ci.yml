name: Verify source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Isolated SQLite installation, login and backup checks
        run: node --import tsx --test tests/installation.test.ts
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chronicle-cartarium:test .
      - name: Validate downloadable Compose configuration
        env:
          CHRONICLE_CARTARIUM_SETUP_TOKEN: ci-isolated-bootstrap-test-only
        run: docker compose -f docker-compose.image.yml config --quiet
      - name: Fresh container installation status
        shell: bash
        run: |
          docker volume create cc-smoke-data
          docker run -d --name cc-smoke -p 127.0.0.1:3312:3001 -v cc-smoke-data:/app/data -e HOST=0.0.0.0 -e SETUP_TOKEN=ci-isolated-bootstrap-test-only chronicle-cartarium:test
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3312/api/status > /tmp/cc-status.json; then break; fi
            sleep 1
          done
          node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/cc-status.json'));if(!s.setupRequired)process.exit(1)"
          curl --fail --silent -c /tmp/cc-cookies -H 'Content-Type: application/json' --data '{"storage":"sqlite","title":"Isolated CI","theme":"jade","access":"local","username":"ci_gm","password":"ci-test-password-only","fillExample":false,"setupToken":"ci-isolated-bootstrap-test-only"}' http://127.0.0.1:3312/api/install > /tmp/cc-install.json
          curl --fail --silent -b /tmp/cc-cookies http://127.0.0.1:3312/api/workspace > /tmp/cc-workspace.json
          node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/cc-workspace.json'));if(s.data.worlds.length!==0)process.exit(1)"
          docker restart cc-smoke
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3312/api/status > /tmp/cc-status-after.json; then break; fi
            sleep 1
          done
          node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/cc-status-after.json'));if(s.setupRequired)process.exit(1)"
          curl --fail --silent -H 'Content-Type: application/json' --data '{"username":"ci_gm","password":"ci-test-password-only"}' http://127.0.0.1:3312/api/login > /tmp/cc-login.json
      - if: always()
        run: docker logs cc-smoke
      - if: always()
        run: docker rm -f cc-smoke
      - if: always()
        run: docker volume rm cc-smoke-data
